name: PowerShell Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer `
            -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Get-ChildItem -Path . `
            -Recurse -Filter *.ps1 |
            ForEach-Object {
              Write-Host "Analysing: $($_.FullName)"
              Invoke-ScriptAnalyzer `
                -Path $_.FullName `
                -Severity Error, Warning
            }
          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results |
              Where-Object { $_.Severity -eq 'Error' }
            if ($errors) {
              Write-Error "PSScriptAnalyzer found
                $($errors.Count) Error-level issues."
              exit 1
            }
          } else {
            Write-Host "All scripts passed."
          }

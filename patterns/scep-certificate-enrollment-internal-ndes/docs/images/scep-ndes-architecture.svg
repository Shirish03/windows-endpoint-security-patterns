<!--
  SCEP NDES Architecture — Colour Reference
  Cloud zone:    bg=#E6F1FB  border=#378ADD  label=#185FA5
  Internet zone: bg=#F1EFE8   border=#888780   label=#5F5E5A
  DMZ zone:      bg=#FCEBEB   border=#E24B4A   label=#A32D2D
  Intranet zone: bg=#EEEDFE  border=#7F77DD  label=#534AB7
  Server zone:   bg=#EAF3DE   border=#3B6D11   label=#27500A
  Blue boxes:    fill=#E6F1FB  stroke=#185FA5  title=#042C53  sub=#185FA5
  Amber boxes:   fill=#FAEEDA  stroke=#BA7517  title=#633806  sub=#854F0B
  Teal boxes:    fill=#E1F5EE  stroke=#1D9E75  title=#04342C  sub=#0F6E56
  Green boxes:   fill=#EAF3DE  stroke=#3B6D11  title=#173404  sub=#3B6D11
  Arrow colours: blue=#185FA5  green=#1D9E75  purple=#7F77DD  dkgreen=#0F6E56  grey=#888780
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820"
     width="1360" height="1640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="f-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#185FA5"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="r-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M9 1 L1 5 L9 9" fill="none" stroke="#185FA5"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1D9E75"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="r-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M9 1 L1 5 L9 9" fill="none" stroke="#1D9E75"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#7F77DD"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="r-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M9 1 L1 5 L9 9" fill="none" stroke="#7F77DD"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f-dkgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#0F6E56"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="r-dkgreen" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M9 1 L1 5 L9 9" fill="none" stroke="#0F6E56"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="f-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#888780"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="r-grey" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M9 1 L1 5 L9 9" fill="none" stroke="#888780"       stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="820" fill="white"/>
  <rect x="40" y="18" width="600" height="112" rx="5" ry="5" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
  <rect x="40" y="140" width="600" height="84" rx="5" ry="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <rect x="40" y="234" width="600" height="56" rx="5" ry="5" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.8"/>
  <rect x="40" y="300" width="600" height="236" rx="5" ry="5" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
  <rect x="40" y="546" width="600" height="128" rx="5" ry="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <rect x="40" y="700" width="600" height="82" rx="5" ry="5" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="54" y="32" fill="#185FA5" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">Cloud services</text>
  <text x="54" y="154" fill="#5F5E5A" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">Internet</text>
  <text x="54" y="314" fill="#534AB7" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">Organisation intranet</text>
  <text x="54" y="560" fill="#27500A" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">Secure server zone</text>
  <text x="340" y="256" fill="#A32D2D" font-size="10.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">DMZ — intentionally empty</text>
  <text x="340" y="272" fill="#A32D2D" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">No published endpoints.  NDES not reachable from internet.</text>
  <!-- Entra ID -->
  <rect x="70" y="46" width="155" height="44" rx="5" ry="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="147.5" y="62" fill="#042C53" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">Microsoft Entra ID</text>
  <text x="147.5" y="75" fill="#185FA5" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Identity platform</text>
  <!-- Intune -->
  <rect x="264" y="46" width="152" height="44" rx="5" ry="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="340.0" y="62" fill="#042C53" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">Microsoft Intune</text>
  <text x="340.0" y="75" fill="#185FA5" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">MDM + compliance gate</text>
  <!-- ZTNA -->
  <rect x="454" y="46" width="152" height="44" rx="5" ry="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="530.0" y="62" fill="#042C53" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">ZTNA broker</text>
  <text x="530.0" y="75" fill="#185FA5" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Zscaler ZPA cloud</text>
  <!-- Remote -->
  <rect x="454" y="162" width="152" height="44" rx="5" ry="5" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.6"/>
  <text x="530.0" y="178" fill="#633806" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">Remote devices</text>
  <text x="530.0" y="191" fill="#854F0B" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">off-network / internet</text>
  <text x="222" y="180" fill="#888780" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">No direct path to intranet.</text>
  <text x="222" y="196" fill="#888780" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">SCEP URL not resolvable externally.</text>
  <!-- On-prem -->
  <rect x="64" y="326" width="152" height="44" rx="5" ry="5" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.6"/>
  <text x="140.0" y="342" fill="#633806" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">On-prem devices</text>
  <text x="140.0" y="355" fill="#854F0B" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">LAN / Wi-Fi</text>
  <!-- Connector -->
  <rect x="264" y="326" width="152" height="44" rx="5" ry="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
  <text x="340.0" y="342" fill="#04342C" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">Cert Connector v2</text>
  <text x="340.0" y="355" fill="#0F6E56" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">NDES on same server</text>
  <!-- AppConn -->
  <rect x="454" y="326" width="152" height="44" rx="5" ry="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
  <text x="530.0" y="342" fill="#04342C" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">App Connector</text>
  <text x="530.0" y="355" fill="#0F6E56" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">ZPA ingress relay</text>
  <!-- DC -->
  <rect x="62" y="562" width="156" height="44" rx="5" ry="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
  <text x="140.0" y="578" fill="#173404" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">Domain controller</text>
  <text x="140.0" y="591" fill="#3B6D11" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">Active Directory</text>
  <!-- IssuingCA -->
  <rect x="264" y="562" width="152" height="44" rx="5" ry="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
  <text x="340.0" y="578" fill="#173404" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">Issuing CA</text>
  <text x="340.0" y="591" fill="#3B6D11" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">AD Cert Services</text>
  <!-- RootCA -->
  <rect x="454" y="562" width="152" height="44" rx="5" ry="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
  <text x="530.0" y="578" fill="#173404" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="central">Root CA</text>
  <text x="530.0" y="591" fill="#3B6D11" font-size="8.5" font-weight="normal" text-anchor="middle" dominant-baseline="central">PKI trust anchor</text>
  <text x="64" y="390" fill="#534AB7" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">Internal DNS alias:</text>
  <text x="64" y="406" fill="#534AB7" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">SCEP URL resolves on intranet only</text>
  <text x="64" y="421" fill="#534AB7" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">(not in public DNS)</text>
  <text x="64" y="443" fill="#185FA5" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">③&amp;⑨ Connector → Intune outbound</text>
  <text x="64" y="458" fill="#185FA5" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">④ Intune → Connector (approval)</text>
  <text x="360" y="390" fill="#1D9E75" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">⑩ Remote: cert returned via ZTNA</text>
  <text x="360" y="406" fill="#1D9E75" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">(reverse of ②a ②b ②c)</text>
  <line x1="340" y1="90" x2="340" y2="136" stroke="#185FA5" stroke-width="1.3"/>
  <line x1="140" y1="136" x2="528" y2="136" stroke="#185FA5" stroke-width="1.3"/>
  <line x1="140" y1="136" x2="140" y2="324" stroke="#185FA5" stroke-width="1.3" marker-end="url(#f-blue)"/>
  <line x1="528" y1="136" x2="528" y2="162" stroke="#185FA5" stroke-width="1.3" marker-end="url(#f-blue)"/>
  <rect x="120" y="109" width="434" height="16" fill="white" fill-opacity="0.92" rx="2"/>
  <text x="334" y="117" fill="#185FA5" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">①  Intune → Devices (all): MDM over HTTPS — profile + SCEP URL</text>
  <line x1="216" y1="342" x2="264" y2="342" stroke="#1D9E75" stroke-width="1.3" marker-end="url(#f-green)"/>
  <text x="240" y="330" fill="#1D9E75" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">②</text>
  <line x1="264" y1="358" x2="218" y2="358" stroke="#1D9E75" stroke-width="1.3" marker-end="url(#r-green)"/>
  <text x="241" y="370" fill="#1D9E75" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">⑩</text>
  <line x1="534" y1="162" x2="534" y2="92" stroke="#7F77DD" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#f-purple)"/>
  <text x="546" y="130" fill="#7F77DD" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">②a</text>
  <path d="M 606,68 L 622,68 L 622,342 L 607,342" fill="none" stroke="#7F77DD" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#f-purple)" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="630" y="205" fill="#7F77DD" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">②b</text>
  <line x1="454" y1="352" x2="418" y2="352" stroke="#7F77DD" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#r-purple)"/>
  <text x="436" y="340" fill="#7F77DD" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">②c</text>
  <line x1="336" y1="326" x2="336" y2="302" stroke="#185FA5" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#f-blue)"/>
  <line x1="344" y1="302" x2="344" y2="326" stroke="#185FA5" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#r-blue)"/>
  <text x="324" y="314" fill="#185FA5" font-size="9" font-weight="normal" text-anchor="end" dominant-baseline="central">③&amp;⑨</text>
  <text x="348" y="314" fill="#185FA5" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">④</text>
  <path d="M 416,370 L 416,374 L 506,374 L 506,524 L 140,524 L 140,562" fill="none" stroke="#888780" stroke-width="1.0" stroke-dasharray="3,2" marker-end="url(#f-grey)" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="318" y="518" fill="#888780" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">⑤  NDES → DC</text>
  <line x1="344" y1="370" x2="344" y2="562" stroke="#1D9E75" stroke-width="1.3" marker-end="url(#f-green)"/>
  <text x="354" y="464" fill="#1D9E75" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">⑥ cert request</text>
  <line x1="264" y1="584" x2="220" y2="584" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#r-dkgreen)"/>
  <text x="242" y="572" fill="#0F6E56" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">⑦ Kerberos/LDAP</text>
  <line x1="336" y1="562" x2="336" y2="372" stroke="#1D9E75" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#f-green)"/>
  <text x="326" y="470" fill="#888780" font-size="9" font-weight="normal" text-anchor="end" dominant-baseline="central">⑧ cert issued</text>
  <path d="M 454,584 L 418,584" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-start="url(#r-dkgreen)" marker-end="url(#f-dkgreen)" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="436" y="572" fill="#0F6E56" font-size="9" font-weight="normal" text-anchor="middle" dominant-baseline="central">PKI trust / CRL</text>
  <line x1="56" y1="716" x2="80" y2="716" stroke="#185FA5" stroke-width="1.8"/>
  <text x="86" y="716" fill="#185FA5" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">① MDM profile delivery</text>
  <line x1="242" y1="716" x2="266" y2="716" stroke="#1D9E75" stroke-width="1.8"/>
  <text x="272" y="716" fill="#1D9E75" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">② ③ ⑩ ⑥ ⑧  SCEP + cert chain</text>
  <line x1="464" y1="716" x2="488" y2="716" stroke="#7F77DD" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="494" y="716" fill="#7F77DD" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">②a ②b ②c  ZTNA path</text>
  <line x1="604" y1="716" x2="628" y2="716" stroke="#0F6E56" stroke-width="1.8"/>
  <text x="634" y="716" fill="#0F6E56" font-size="9" font-weight="normal" text-anchor="start" dominant-baseline="central">⑦⑨  PKI + DC</text>
  <text x="56" y="735" fill="#888780" font-size="8" font-weight="normal" text-anchor="start" dominant-baseline="central">③&amp;⑨ Connector→Intune outbound.  ④ Intune→Connector (approval).  ⑧ dashed = cert return.</text>
  <text x="56" y="750" fill="#888780" font-size="8" font-weight="normal" text-anchor="start" dominant-baseline="central">②a Remote→ZPA cloud.  ②b ZPA cloud→App Connector.  ⑤ grey dashed = NDES→DC Kerberos.  ⑩ NDES→Devices (SCEP response).</text>
  <text x="56" y="765" fill="#888780" font-size="8" font-weight="normal" text-anchor="start" dominant-baseline="central">⑥ NDES→Issuing CA (cert request).  ⑧ Issuing CA→NDES (RPC/DCOM).  Root CA ↔ Issuing CA: PKI trust chain / CRL.</text>
</svg>
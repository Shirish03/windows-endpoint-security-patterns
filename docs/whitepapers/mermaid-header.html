<style>
/* Inject mermaid diagram container styling via header so it loads with the document */
.mermaid { text-align: center; margin: 1.5rem 0; }
</style>
<script>
/* Convert pandoc-generated <pre><code class="language-mermaid"> to <div class="mermaid">
   so Mermaid.js can render the diagrams. Runs before mermaid.initialize(). */
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
    var div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    code.parentNode.replaceWith(div);
  });
});
</script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
mermaid.initialize({ startOnLoad: true, theme: "base", themeVariables: {
  primaryColor: "#e8eaf6",
  primaryBorderColor: "#3949ab",
  primaryTextColor: "#1a237e",
  lineColor: "#5c6bc0",
  secondaryColor: "#f3e8fd",
  tertiaryColor: "#e6f4ea"
}});
</script>
